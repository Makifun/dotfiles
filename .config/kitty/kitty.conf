# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# font size
font_size 12.0

# terminfo fix if need do be
# term xterm-256color

# scrollback
scrollback_lines 5000
wheel_scroll_multiplier 3.0

# no audio bell
enable_audio_bell no

# background
background_blur 1
background_opacity 1.0

# tab bar
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge bottom
tab_bar_align left
active_tab_font_style   bold
inactive_tab_font_style normal

# misc
detect_urls yes
confirm_os_window_close 0
shell sh -c "fastfetch; exec zsh"
